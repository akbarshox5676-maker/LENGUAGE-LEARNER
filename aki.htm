.gh small,.dw small,.card small,.unit small,.stat b{font-size:12.5px;font-weight:600;color:var(--mut)}
.sec{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--fg);margin:26px 20px 8px}
/* yuqori panel */
.top{padding:12px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mini{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.tr{gap:14px;font-family:var(--fd);font-weight:700;font-size:16px}
.tr span:nth-child(1) svg{color:#f08a24}.tr span:nth-child(2) svg{color:#22c5b5}
/* bugungi maqsad: bosh karta */
.gh{position:relative;overflow:hidden;margin:16px 16px 12px;padding:22px 22px;border:0;border-radius:22px;color:#fff;background:linear-gradient(135deg,#0c3b4a 0%,#0f6a69 58%,#13a396 100%);box-shadow:0 14px 30px -12px rgba(8,90,95,.55)}
.gh:before{content:"";position:absolute;inset:0;background:var(--pat);background-size:44px 44px;opacity:.09;-webkit-mask-image:linear-gradient(100deg,transparent 10%,#000 90%);mask-image:linear-gradient(100deg,transparent 10%,#000 90%)}
.gh>*{position:relative}.gh small,.gh p{color:rgba(255,255,255,.78)}
.gh h2{font-size:34px;font-weight:800;margin:4px 0 2px;letter-spacing:-.035em}
.gh svg circle:first-child{stroke:rgba(255,255,255,.22)}.gh svg circle:nth-child(2){stroke:#f6c453}.gh svg text{fill:#fff}
/* kartalar: bitta soya, bitta radius mantiqi */
.dw{border-radius:18px;border-color:var(--line);background:var(--card);box-shadow:none}
.dw b{font-size:19px;font-weight:700}
.dw .mp,.dw .mp.q{height:8px;flex:none;padding:0}
.qa{gap:10px;margin:4px 16px 4px}
.qa button{border-radius:18px;padding:14px 2px 12px;box-shadow:none;gap:8px}
.qa button svg{width:38px;height:38px;padding:9px;border-radius:13px;background:color-mix(in srgb,var(--acc) 15%,var(--soft));color:var(--acc)}
.qa button:nth-child(2) svg{background:color-mix(in srgb,#e8a317 17%,var(--soft));color:var(--gold)}
.qa button:nth-child(3) svg{background:color-mix(in srgb,#e0526a 16%,var(--soft));color:#e0526a}
.qa button:nth-child(4) svg{background:color-mix(in srgb,#4f7cff 16%,var(--soft));color:#5b86ff}
.qa span{color:var(--fg);font-size:12px}
.qa button:active{transform:scale(.96)}
/* mavzu kartalari */
.car{padding:6px 6% 10px;gap:14px}
.card{position:relative;overflow:hidden;border:0;border-radius:24px;padding:22px 22px 20px;min-height:228px;display:flex;flex-direction:column;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 78%,#06202a),color-mix(in srgb,var(--tc) 38%,#06141c));box-shadow:0 16px 30px -16px color-mix(in srgb,var(--tc) 80%,#000)}
.card:before{content:"";position:absolute;right:-40px;top:-44px;width:150px;height:150px;background:rgba(255,255,255,.09);clip-path:polygon(50.0% 0.0%,64.7% 14.6%,85.4% 14.6%,85.4% 35.3%,100.0% 50.0%,85.4% 64.7%,85.4% 85.4%,64.7% 85.4%,50.0% 100.0%,35.3% 85.4%,14.6% 85.4%,14.6% 64.7%,0.0% 50.0%,14.6% 35.3%,14.6% 14.6%,35.3% 14.6%)}
.card:after{content:"";position:absolute;inset:0;background:var(--pat);background-size:44px 44px;opacity:.07;pointer-events:none}
.card>*{position:relative;z-index:1}
.card small{color:rgba(255,255,255,.8)}
.card h2{font-size:26px;font-weight:800;line-height:1.08;margin:6px 0 6px;max-width:80%}
.card p{color:rgba(255,255,255,.82);font-size:14px;margin-bottom:auto}
.card .cnt{color:rgba(255,255,255,.9);font-weight:600;margin:16px 0 8px}
.card .mp{background:rgba(255,255,255,.22);height:7px}.card .mp i{background:#fff}
.card .cbtn{background:#fff;color:#0a2430;box-shadow:none;font-weight:700;margin-top:14px}
.card .cbtn:disabled{background:rgba(255,255,255,.2);color:rgba(255,255,255,.7)}
.dots .on{background:var(--acc)}
/* tugmalar */
.btn,.cbtn{background:linear-gradient(180deg,var(--acc),var(--acc2));font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:-.01em;border-radius:14px;padding:14px;box-shadow:0 8px 18px -8px var(--acc);transition:transform .12s,filter .15s}
.btn:active,.cbtn:active{transform:translateY(1px) scale(.99)}
.btn.ghost{background:var(--card);box-shadow:none}.btn:disabled,.cbtn:disabled{background:var(--soft);box-shadow:none;color:var(--mut)}
.btn.red{background:var(--bad)}
.inp{border-radius:14px;padding:14px;background:var(--card);font-size:16px}.inp:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
/* pastki menyu */
.nav{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:none}
.nav button{position:relative;font-weight:600;font-size:11px}.nav .on{color:var(--acc)}.nav .on:before{content:"";position:absolute;top:-1px;left:34%;right:34%;height:3px;border-radius:0 0 4px 4px;background:var(--acc)}
/* modul yo'li: sakkiz qirrali yulduz */
.unit{border:0;border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);position:relative;overflow:hidden;padding:14px 16px}
.unit:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc)}
.unit h3{font-size:19px;font-weight:800}.unit>span{font-family:var(--fd);font-weight:700;color:var(--fg)}
.upb{height:7px;margin:-2px 20px 6px;border-radius:5px;background:var(--line);overflow:hidden}.upb i{display:block;height:100%;background:var(--tc);border-radius:5px;transition:width .5s}
.path{--c:var(--tc,var(--acc));padding:4px 0 36px}
.path .node{width:74px;height:74px;border-radius:0;background:none!important;box-shadow:none!important;border:0;margin:30px 0 6px;font-family:var(--fd);font-size:24px;font-weight:800;color:#fff;filter:drop-shadow(0 8px 10px color-mix(in srgb,var(--c) 45%,transparent));animation:none}
.path .node:before{content:"";z-index:-1;position:absolute;inset:0;clip-path:polygon(50.0% 0.0%,64.7% 14.6%,85.4% 14.6%,85.4% 35.3%,100.0% 50.0%,85.4% 64.7%,85.4% 85.4%,64.7% 85.4%,50.0% 100.0%,35.3% 85.4%,14.6% 85.4%,14.6% 64.7%,0.0% 50.0%,14.6% 35.3%,14.6% 14.6%,35.3% 14.6%);background:linear-gradient(155deg,color-mix(in srgb,var(--c) 90%,#fff),color-mix(in srgb,var(--c) 70%,#000))}
.path .node:after{content:"";z-index:-1;position:absolute;inset:9px;clip-path:polygon(50.0% 0.0%,64.7% 14.6%,85.4% 14.6%,85.4% 35.3%,100.0% 50.0%,85.4% 64.7%,85.4% 85.4%,64.7% 85.4%,50.0% 100.0%,35.3% 85.4%,14.6% 85.4%,14.6% 64.7%,0.0% 50.0%,14.6% 35.3%,14.6% 14.6%,35.3% 14.6%);background:rgba(255,255,255,.14);pointer-events:none}
.path .node{isolation:isolate}.path .node svg{position:relative}
.path .node.done:before{background:linear-gradient(155deg,#34d3a0,#079669)}
.path .node.lock{filter:none;color:var(--mut)}
.path .node.lock:before{background:var(--line)}.path .node.lock:after{background:transparent;box-shadow:none}
.path .node.cur:before{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{transform:rotate(22.5deg) scale(1.04)}}
.path .node em{top:-26px;font-family:var(--fd);font-weight:700;font-size:12px;border-radius:8px;padding:2px 10px;filter:none;z-index:2}
.nl{font-family:var(--fb);font-size:13px;font-weight:600;color:var(--mut);background:none;border:0;padding:0;margin:0 0 4px}
.nl.on{color:var(--fg);background:none;border:0}
/* dars ekrani */
.lesson{padding:18px}
.bar{gap:14px}.prog{height:12px;border-radius:8px;background:var(--soft);overflow:hidden}.prog i{background:linear-gradient(90deg,var(--acc),#3fd6c4);border-radius:8px}
.lesson .q h2{font-size:26px;line-height:1.18;font-weight:800;margin:22px 0 18px;letter-spacing:-.03em}
.prompt{font-size:30px;font-weight:800;border-radius:20px;padding:18px;background:var(--card)}
.prompt small{font-size:14px;font-weight:500}.prompt .spk{font-size:15px;font-family:var(--fb)}
.spk{background:color-mix(in srgb,var(--acc) 16%,var(--soft));color:var(--acc);border-radius:14px}
.opt{border-radius:16px;padding:16px;font-size:17px;font-weight:600;border:1.5px solid var(--line);border-bottom-width:3px;background:var(--card)}
.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card));color:var(--fg)}
.foot h3{font-family:var(--fd);font-size:20px;font-weight:800}
.foot small{display:block;margin-top:6px;font-size:13px;color:inherit;opacity:.9}
.end h1{font-size:30px;font-weight:800}.end .big{color:var(--gold)}
.stat{border-radius:16px;background:var(--card)}.stat span{font-family:var(--fd);font-weight:800;font-size:20px}
/* kirish */
.ow{background:radial-gradient(120% 50% at 50% -10%,color-mix(in srgb,var(--acc) 26%,transparent),transparent 70%),var(--bg)}
.olg{width:96px;height:96px;border-radius:0;border:0;background:linear-gradient(155deg,#2fd0bf,#0b7a70);color:#fff;clip-path:polygon(50.0% 0.0%,64.7% 14.6%,85.4% 14.6%,85.4% 35.3%,100.0% 50.0%,85.4% 64.7%,85.4% 85.4%,64.7% 85.4%,50.0% 100.0%,35.3% 85.4%,14.6% 85.4%,14.6% 64.7%,0.0% 50.0%,14.6% 35.3%,14.6% 14.6%,35.3% 14.6%);box-shadow:none}
.olg svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.ohero{filter:none}.ohero h1{font-size:46px;font-weight:800;letter-spacing:-.05em}
.ot{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.12;margin:30px 0 6px}
.oo{border-radius:16px;padding:15px 16px;font-family:var(--fb);border-width:1.5px;border-bottom-width:3px}
.oo:hover,.oo:active{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.ob-bar{height:12px;background:var(--soft)}.ob-bar i{background:linear-gradient(90deg,var(--acc),#3fd6c4)}
/* tarjimon */
.trout{border-radius:18px;font-family:var(--fd);font-size:22px;font-weight:700;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.tra{border-radius:18px;font-size:20px;font-family:var(--fb)}
.trl select{border-radius:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){.path .node.cur:before{animation:none}}

/* bosganda ko'k ramka chiqmasin */
*{-webkit-tap-highlight-color:transparent}
button,a,select,[onclick],[role=button],.opt,.oo,.card,.dw,.slide{outline:none;-webkit-touch-callout:none}
:focus:not(:focus-visible){outline:none!important}
body{-webkit-user-select:none;user-select:none}
input,textarea,.trout,.tra{-webkit-user-select:text;user-select:text}
button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* yangiliklar */
.nh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.nh h2{margin:0;font-size:26px}.nh .x{background:none;border:0;color:var(--fg);padding:6px;margin-left:-8px;cursor:pointer;display:flex}
.nw{border-radius:22px;overflow:hidden;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:14px}
.na svg{display:block;width:100%;height:150px}
.nb2{padding:14px 16px 16px}.nb2 h3{font-size:20px;font-weight:800;margin:8px 0 4px}.nb2 p{margin:0;color:var(--mut);font-size:14.5px;line-height:1.45}
.nm{display:flex;align-items:center;justify-content:space-between}.nm small{color:var(--mut);font-size:12.5px}
.tg{background:color-mix(in srgb,var(--acc) 18%,var(--card));color:var(--acc);font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px}
.nbn{display:flex;align-items:center;gap:14px;margin:0 16px 12px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.nbn:active{transform:scale(.99)}
.nbt{width:62px;height:62px;border-radius:16px;overflow:hidden;flex:none}.nbt svg{display:block;width:100%;height:100%}
.nbx{flex:1;min-width:0}.nbx b{display:block;font-family:var(--fd);font-size:17px;font-weight:700}.nbx small{color:var(--mut);font-size:13px}
.nbn>svg{color:var(--mut);transform:rotate(180deg)}

/* kurs o'chirish (bosib turish) */
.dd button{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.dd .fl{position:relative}
.dd .dx .fl{animation:dxj .35s ease-in-out infinite alternate;border-color:var(--bad)}
.dd .del{position:absolute;top:-9px;right:-9px;width:28px;height:28px;border-radius:50%;background:var(--bad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35);font-size:0}
.dd .hint{width:100%;text-align:center;font-size:11.5px;color:var(--mut);margin:-4px 0 0}
@keyframes dxj{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
/* jonli avatar */
.pf .pb{bottom:auto;top:14px}
.avw{position:relative;width:128px;height:128px;margin:0 auto;cursor:pointer;animation:avFloat 3s ease-in-out infinite alternate;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.avr1{width:128px;height:128px;transform-origin:50% 92%}
#avs{width:128px;height:128px}
.avfx{position:absolute;left:-30px;right:-30px;top:-10px;bottom:0;pointer-events:none}
.avfx span{position:absolute;font-size:22px;opacity:0;animation:avUp 2.2s ease-out forwards}
.avb{position:relative;max-width:82%;min-height:40px;margin:12px auto 4px;padding:9px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13.5px;line-height:1.35;color:var(--fg);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s;display:flex;align-items:center;justify-content:center}
.avb.on{opacity:1;transform:none}
.avb:before{content:"";position:absolute;top:-6px;left:50%;margin-left:-6px;width:10px;height:10px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.avrow{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 6px;scrollbar-width:none;text-align:left}.avrow::-webkit-scrollbar{display:none}
.ae{flex:none;min-width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:22px;cursor:pointer;padding:0 10px;transition:transform .12s}
.ae:active{transform:scale(.86)}.ae.wide{font-size:13.5px;font-weight:600;padding:0 14px}
@keyframes avFloat{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-3px) scale(1.025)}}
@keyframes avTilt{0%,100%{transform:rotate(0)}40%{transform:rotate(-4deg)}}
@keyframes avNod{0%,100%{transform:translateY(0)}30%{transform:translateY(5px)}60%{transform:translateY(0)}80%{transform:translateY(3px)}}
@keyframes avNo{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes avPop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes avBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes avSad{0%{transform:none}100%{transform:translateY(4px) scaleY(.97)}}
@keyframes avSnore{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes avRing{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.35);opacity:0}}
.av-tilt{animation:avTilt 1.2s ease-in-out 1}.av-nod{animation:avNod .9s ease-in-out 1}.av-no{animation:avNo .5s ease-in-out 2}.av-pop{animation:avPop .5s ease-out 1}.av-bob{animation:avBob .4s ease-in-out 3}.av-sad{animation:avSad .8s ease forwards}.av-slow{animation:avSnore 2.8s ease-in-out infinite}
.avfx{left:0;right:0;top:0;bottom:0}.avfx .rg{position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);animation:avRing .9s ease-out forwards}
.ae{height:34px;min-width:0;border-radius:17px;font-size:13px;font-weight:600;padding:0 14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.ae.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.nomo *,.nomo *:before,.nomo *:after{animation:none!important;transition:none!important}.noan .avw,.noan .avr1{animation:none!important}

.ig{padding:6px 16px 20px}
.igt{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}.igt b{font-size:19px;font-weight:700}.igt div{display:flex;gap:8px}
